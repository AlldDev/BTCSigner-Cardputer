; PlatformIO project: BTCSigner Cardputer
; Signer Bitcoin stateless e air-gapped para M5Stack Cardputer (ESP32-S3).
;
; Ambientes:
;   cardputer  - firmware real para o hardware (build de release, Serial off)
;   cardputer-debug - mesma coisa mas com Serial ligado, para desenvolvimento
;   native     - roda os testes de criptografia/PSBT no host, sem hardware
;
; Build:      pio run -e cardputer
; Merge bin:  ver README.md (comando esptool.py merge_bin documentado lá)
; Testes:     pio test -e native

[platformio]
default_envs = cardputer

; --- Flags comuns do trezor-crypto (crypto/options.h) ---
; Desligamos explicitamente todos os altcoins/curvas que este firmware nao usa.
; So Bitcoin / secp256k1 / BIP32 / BIP39 / BIP84 sao necessarios.
[trezor_crypto_flags]
build_flags =
    -DUSE_ETHEREUM=0
    -DUSE_NEM=0
    -DUSE_MONERO=0
    -DUSE_CARDANO=0
    -DUSE_BIP32_25519_CURVES=0
    ; O cache BIP39 (ligado por padrao em options.h) guarda mnemonico,
    ; passphrase e seed em claro num buffer estatico que nenhum wipe da
    ; sessao alcanca. keys.cpp tem um static_assert contra remover isto.
    -DUSE_BIP39_CACHE=0
    -I lib/trezor-firmware/crypto
    -I lib/trezor-firmware/crypto/ed25519-donna
    ; O framework arduino-esp32 sempre linka libwpa_supplicant.a (parte do
    ; wifi/BLE do ESP-IDF, mesmo sem chamar nenhuma API de radio), e essa
    ; lib define seu proprio simbolo `hmac_sha256`, colidindo com o nome
    ; identico em hmac.c do trezor-crypto (ambos definem a MESMA funcao,
    ; nao relacionadas). Renomeia so esse simbolo via macro do compilador
    ; para nao editar o arquivo vendorizado. Como a flag vale para todo o
    ; build, quem chama hmac_sha256() (src/rfid_seed_card.cpp) tambem passa
    ; a chamar o nome renomeado — sempre a versao do trezor-crypto. Sem isso o
    ; link do ambiente `cardputer` falha com "multiple definition of hmac_sha256".
    -Dhmac_sha256=btcseed_tc_hmac_sha256
    ; Mesma colisao com libwpa_supplicant.a (crypto_mbedtls.c) para as funcoes
    ; de bloco AES de aes/aescrypt.c, usadas por aes_cbc_* no backup RFID.
    ; Renomeia so esses dois tokens (aes_encrypt_ctx/aes_encrypt_key256 sao
    ; tokens distintos e nao sao afetados).
    -Daes_encrypt=btcseed_tc_aes_encrypt
    -Daes_decrypt=btcseed_tc_aes_decrypt

[env]
; trezor_crypto (lib/trezor_crypto/) nao e referenciado via #include de um
; header seu (ele so tem .c "trampolim", ver lib/trezor_crypto/README.md),
; entao o LDF do PlatformIO nunca o descobriria sozinho. Listar aqui forca a
; compilacao/link independente de deteccao automatica. Cada [env:*] que
; define seu proprio lib_deps deve reincluir ${env.lib_deps} para nao perder
; isso (ver env:cardputer).
lib_deps = trezor_crypto
build_src_filter =
    +<*>
; O submodulo trezor-firmware/ (crypto/ dentro dele) NUNCA e compilado
; diretamente como uma "library" do PlatformIO: ele contem codigo de outras
; moedas, testes, fuzzers e ferramentas com main() proprio que quebrariam o
; build. Em vez disso, lib/trezor_crypto/ contem arquivos "trampolim" que
; dao #include no .c exato do submodulo que precisamos (ver
; lib/trezor_crypto/README.md). Os headers sao acessiveis via -I acima.
lib_ignore = trezor-firmware

[env:cardputer]
platform = espressif32 @ 6.9.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    m5stack/M5Cardputer @ 1.1.1
    m5stack/M5Unified @ 0.2.23
    m5stack/M5GFX @ 0.2.30
build_flags =
    ${trezor_crypto_flags.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DBTCSEED_RELEASE=1
    ; O sdkconfig pre-compilado grava core dump na flash e imprime o panic na
    ; UART0/USB. Os dois wraps (implementados em src/panic_hooks.cpp) impedem
    ; o core dump e trocam o panic por wipe + reset silencioso. Nao remover.
    -Wl,--wrap=esp_core_dump_to_flash
    -Wl,--wrap=esp_panic_handler
build_unflags =
    -DARDUINO_USB_CDC_ON_BOOT
build_type = release

[env:cardputer-debug]
extends = env:cardputer
build_flags =
    ${trezor_crypto_flags.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DBTCSEED_RELEASE=0
    ; Sem core dump na flash tambem no debug; o panic continua impresso na
    ; serial (sem wrap de esp_panic_handler) para desenvolver.
    -Wl,--wrap=esp_core_dump_to_flash
build_type = debug

; Ambiente "native": compila e roda os testes de criptografia/PSBT no host
; (Linux/macOS), sem hardware nenhum. Nao usa M5Cardputer/M5Unified.
[env:native]
platform = native
build_flags =
    ${trezor_crypto_flags.build_flags}
    -DBTCSEED_NATIVE_TEST=1
    -std=gnu11
build_src_filter =
    +<*>
    -<main.cpp>
    -<ui.cpp>
    -<sd_io.cpp>
    -<rfid_io.cpp>
    -<panic_hooks.cpp>
; MFRC522_I2C (lib/, driver da Unit RFID2) depende de Arduino/Wire.
lib_ignore =
    ${env.lib_ignore}
    MFRC522_I2C
test_build_src = yes
